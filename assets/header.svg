<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sebastian R.O. Marshall, Climate Scientist and Ph.D. Researcher, Johns Hopkins University">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="120%">
      <stop offset="0" stop-color="#0a2a3b"/>
      <stop offset=".45" stop-color="#06212f"/>
      <stop offset="1" stop-color="#03101a"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset=".45" stop-color="#03101a" stop-opacity="0"/>
      <stop offset="1" stop-color="#03101a" stop-opacity=".62"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="26"/></clipPath>
    <style>
      .ring{fill:none;stroke:#8fe3f0;stroke-width:1.1}
      .flow{fill:none;stroke:#8fe3f0;stroke-width:1.2;stroke-linecap:round;stroke-dasharray:90 34;animation:run 26s linear infinite}
      .flow.b{stroke:#5fb6cf;stroke-dasharray:60 46;animation-duration:34s}
      .eddy{transform-box:fill-box;transform-origin:center;animation:turn 90s linear infinite}
      .eddy.r{animation-direction:reverse;animation-duration:120s}
      @keyframes run{to{stroke-dashoffset:-1240}}
      @keyframes turn{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.flow,.eddy{animation:none}}
      .name{font:600 56px Georgia,'Times New Roman',serif;fill:#f4f9fb;letter-spacing:-1px}
      .role{font:400 17px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#bccdd4}
      .tag{font:400 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#dde8ec}
      .mono{font:400 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#5fb6cf;letter-spacing:3px}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- eddies: the concentric current rings from the site -->
    <g opacity=".34">
      <g class="eddy" transform="translate(150 96)">
        <ellipse class="ring" rx="18" ry="11"/><ellipse class="ring" rx="36" ry="23"/><ellipse class="ring" rx="56" ry="37"/><ellipse class="ring" rx="78" ry="53" opacity=".7"/><ellipse class="ring" rx="102" ry="70" opacity=".45"/>
      </g>
      <g class="eddy r" transform="translate(1050 214) rotate(-18)">
        <ellipse class="ring" rx="20" ry="13"/><ellipse class="ring" rx="42" ry="28"/><ellipse class="ring" rx="66" ry="45"/><ellipse class="ring" rx="92" ry="63" opacity=".7"/><ellipse class="ring" rx="120" ry="83" opacity=".45"/>
      </g>
      <g class="eddy" transform="translate(905 58) rotate(24)">
        <ellipse class="ring" rx="12" ry="8"/><ellipse class="ring" rx="26" ry="17"/><ellipse class="ring" rx="42" ry="28" opacity=".7"/>
      </g>
      <g class="eddy r" transform="translate(292 262) rotate(12)">
        <ellipse class="ring" rx="14" ry="9"/><ellipse class="ring" rx="30" ry="19"/><ellipse class="ring" rx="48" ry="31" opacity=".7"/>
      </g>
    </g>
    <!-- streamlines -->
    <g opacity=".3">
      <path class="flow" d="M-20 150 C120 40 260 250 420 170 S700 40 860 150 1080 250 1230 120"/>
      <path class="flow b" d="M-20 210 C140 300 300 110 470 220 S760 300 900 210 1100 80 1230 190"/>
      <path class="flow" d="M-20 60 C160 130 300 -10 480 70 S760 150 930 60 1120 10 1230 60"/>
      <path class="flow b" d="M-20 286 C180 230 340 330 520 280 S820 220 980 290 1140 320 1230 270"/>
    </g>
    <rect width="1200" height="320" fill="url(#vig)"/>
    <text class="mono" x="600" y="98" text-anchor="middle">CLIMATE SCIENCE · FROM ORBIT TO FIELD</text>
    <text class="name" x="600" y="164" text-anchor="middle">Sebastian R.O. Marshall</text>
    <text class="role" x="600" y="200" text-anchor="middle">Climate Scientist · Ph.D. Researcher, Johns Hopkins University</text>
    <text class="tag" x="600" y="236" text-anchor="middle">How a changing climate moves through water, land and food, and what it means for people.</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="26" fill="none" stroke="#e9f6fc" stroke-opacity=".14"/>
</svg>
